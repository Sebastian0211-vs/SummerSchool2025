[project]
name = "summerschool2025"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"  # keep if you're on 3.13 locally
dependencies = [
    "librosa>=0.11.0",
    "mido>=1.3.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.17",
    "mkdocstrings[python]>=0.30.0",
    "pygame>=2.6.1",
    # DO NOT list uv here – it's an installer, installed in CI separately
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "typing-extensions>=4.12.2",
]

[tool.pytest.ini_options]
# src-layout: add src to path and collect tests/
addopts = "-q --cov=src --cov-report=xml"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
lint.select = ["E","F","I","UP","B","SIM","C90"]
lint.ignore = ["E203","E501"]

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
warn_unused_configs = true
mypy_path = "src"
packages = ["midi", "audio", "ui", "utils"]
